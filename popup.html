<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    input {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #3367d6;
    }
  </style>
</head>

<body>
  <h3>Auto Fill Extension</h3>
  <input type="text" id="apiUrl" placeholder="Nhập API URL">
  <button id="fillBtn">Điền Dữ Liệu</button>

  <script src="popup.js"></script>
</body>

</html>
